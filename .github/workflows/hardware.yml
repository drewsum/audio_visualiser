# KiCad hardware CI: hygiene, ERC/DRC/library checks and visual diff.
# Fab outputs and releases are manual: python3 tools/ci/kicad_ci.py outputs <project dir> --out <dir>
# Behaviour per project is configured in hdw/ci-config.json; logic lives in tools/ci/kicad_ci.py.
name: Hardware

on:
  push:
    branches: ['**']
    paths:
      - 'hdw/**'
      - 'tools/ci/**'
      - '.github/workflows/hardware.yml'
  pull_request:
    paths:
      - 'hdw/**'
      - 'tools/ci/**'
      - '.github/workflows/hardware.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history to tell whether the committed schematic PDF is stale
      - run: python3 tools/ci/kicad_ci.py hygiene

  discover:
    name: Find KiCad projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: python3 tools/ci/kicad_ci.py projects

  check:
    name: ERC / DRC / libraries (${{ matrix.name }})
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
      credentials:  # authenticated pulls avoid Docker Hub's anonymous rate limit
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure KiCad libraries
        run: python3 tools/ci/kicad_ci.py setup
      - name: Run checks
        run: python3 tools/ci/kicad_ci.py check "${{ matrix.dir }}" --out "ci-out/reports"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-${{ matrix.slug }}
          path: ci-out/reports
          if-no-files-found: ignore

  # Runs on every pipeline run. Base commit per trigger:
  #   pull_request      -> PR base
  #   push              -> previous tip of the branch (falls back to merge-base with the
  #                        default branch for new branches / force pushes)
  #   workflow_dispatch -> parent commit
  # The result is uploaded unzipped as visual-diff.html (images inlined), so clicking the
  # artifact or the link in the run summary opens it in the browser (red = removed, green = added).
  visual-diff:
    name: Visual diff
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
      credentials:  # authenticated pulls avoid Docker Hub's anonymous rate limit
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install image tools
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends librsvg2-bin imagemagick
      - name: Pick base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          exists() { [ -n "$1" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && exists "$BEFORE"; then
            base="$BEFORE"
          elif [ "$EVENT" = push ] && [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            base=$(git merge-base HEAD "origin/$DEFAULT_BRANCH" 2>/dev/null || true)
          fi
          # Last resort: the parent commit (none exists for a root commit).
          if ! exists "$base" || [ "$(git rev-parse "$base")" = "$(git rev-parse HEAD)" ]; then
            base=$(git rev-parse -q --verify HEAD^ || true)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "Comparing ${base:-<nothing>} -> $(git rev-parse HEAD)"
      - name: Render diff
        if: steps.base.outputs.sha != ''
        run: python3 tools/ci/kicad_ci.py diff --base "${{ steps.base.outputs.sha }}" --out ci-out/visual-diff
      - name: No base commit
        if: steps.base.outputs.sha == ''
        run: echo "## Visual diff"$'\n\n'"No earlier commit to compare against." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diff page
        id: upload
        if: steps.base.outputs.sha != ''
        uses: actions/upload-artifact@v7
        with:
          path: ci-out/visual-diff/visual-diff.html
          archive: false  # single unzipped file: opens straight in the browser
      - name: Link diff page in summary
        if: steps.upload.outputs.artifact-url != ''
        run: echo "**[Open the visual diff](${{ steps.upload.outputs.artifact-url }})**" >> "$GITHUB_STEP_SUMMARY"
